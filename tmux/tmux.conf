# --- basics ---------------------------------------------------------------
unbind C-b
set -g prefix C-s
bind C-s send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top

# --- neovim friendly ------------------------------------------------------
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"
set -g set-clipboard on

# --- copy mode (vi) -------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- panes & windows ------------------------------------------------------
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# vim-tmux-navigator takes C-l, so clear the shell with prefix + C-l
bind C-l send-keys C-l

# --- plugins --------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# --- catppuccin (v2) ------------------------------------------------------
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"

# catppuccin only sets the current-window separators if they are unset, so a
# reload after changing the style would keep the old ones; clear them first
set -gqu @catppuccin_window_current_left_separator
set -gqu @catppuccin_window_current_middle_separator
set -gqu @catppuccin_window_current_right_separator

# short window labels: folder name in a shell, program name otherwise (max 15 chars);
# Claude Code shows up as its version number (e.g. 2.1.311), so name it "claude"
set -g @catppuccin_window_text " #{=/15/…:#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{?#{m/r:^[0-9.]+$,#{pane_current_command}},claude,#{pane_current_command}}}}"
set -g @catppuccin_window_current_text " #{=/15/…:#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{?#{m/r:^[0-9.]+$,#{pane_current_command}},claude,#{pane_current_command}}}}"

# window flags as icons, but only the useful ones (bell = Claude finished / waiting, zoom)
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_current ""
set -g @catppuccin_window_flags_icon_last ""

set -g @catppuccin_status_connect_separator "no"

set -g status-left ""
set -g status-right-length 100
# no -F: modules are expanded on every redraw, so path/session stay current
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_session}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
